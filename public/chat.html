<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
<meta name="referrer" content="no-referrer" />
<meta name="theme-color" content="#7c5cff" />
<title>Murmure · Salon</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="stylesheet" href="style.css" />
</head>
<body class="chat">

<header class="top">
  <div class="orb small" id="status-orb"><div class="orb-inner"></div></div>
  <div class="meta">
    <div class="title" id="title">Salon chiffré</div>
    <div id="status" class="status">Connexion…</div>
  </div>
  <button id="call-btn" class="ghost small" title="Sonner l'autre">📞</button>
  <button id="notif-toggle" class="ghost small" title="Notifications">🔔</button>
  <button id="leave" class="ghost small" title="Quitter">✕</button>
</header>

<section class="codebar" id="codebar">
  <div class="cb-left">
    <span class="cb-label">Code du salon</span>
    <code id="cb-code" class="cb-code">••••••••</code>
    <button id="cb-toggle" class="ghost small" title="Afficher / masquer">👁</button>
    <button id="cb-copy" class="ghost small" title="Copier">⧉</button>
  </div>
  <div class="cb-right">
    <span class="cb-label">Empreinte</span>
    <code id="cb-fp" class="cb-fp" title="Doit être identique des deux côtés">––––</code>
  </div>
</section>

<main id="stream" class="stream"></main>

<div id="typing" class="typing" hidden><span></span><span></span><span></span></div>

<div id="reply-bar" class="reply-bar" hidden>
  <span class="reply-chev">↩</span>
  <div class="reply-info">
    <span class="reply-to" id="reply-to">Réponse à</span>
    <span class="reply-snippet" id="reply-snippet"></span>
  </div>
  <button type="button" id="reply-cancel" class="ghost small" title="Annuler la réponse">✕</button>
</div>

<div id="gif-panel" class="gif-panel" hidden>
  <div class="gif-head">
    <input id="gif-search" type="text" placeholder="Rechercher un GIF…" autocomplete="off" />
    <button type="button" id="gif-close" class="ghost small" title="Fermer">✕</button>
  </div>
  <div id="gif-grid" class="gif-grid"></div>
  <div class="gif-foot">Powered by GIPHY</div>
</div>

<form id="composer" class="composer" autocomplete="off">
  <button type="button" id="attach-btn" class="attach" title="Joindre une image">📎</button>
  <button type="button" id="gif-btn" class="attach gif-btn" title="GIF">GIF</button>
  <input id="attach-input" type="file" accept="image/*" hidden />
  <textarea id="input" rows="1" maxlength="8000"
            placeholder="Écris un message…"></textarea>
  <button type="submit" class="send" title="Envoyer">➤</button>
</form>

<div id="lightbox" class="lightbox" hidden>
  <img id="lightbox-img" alt="" />
  <button id="lightbox-close" class="lightbox-close" title="Fermer">✕</button>
</div>

<div id="emoji-picker" class="emoji-picker" hidden></div>

<script src="/socket.io/socket.io.js"></script>
<script src="chat.js"></script>
</body>
</html>
